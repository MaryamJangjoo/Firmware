<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hex to Float Converter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    padding: 24px;
    line-height: 1.5;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 12px;
    padding: 32px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #1d1d1f;
  }
  .subtitle {
    font-size: 14px;
    color: #6e6e73;
    margin-bottom: 24px;
  }
  .field {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #1d1d1f;
    margin-bottom: 6px;
  }
  input[type="text"], select {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    font-family: 'Consolas', 'Menlo', monospace;
    border: 1px solid #d2d2d7;
    border-radius: 8px;
    background: #fafafa;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: #0071e3;
    background: #ffffff;
  }
  .row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  .row > .field {
    flex: 1;
  }
  .row > .field.small {
    flex: 0 0 140px;
  }
  button {
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #0071e3;
    color: #ffffff;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #0077ed; }
  button:active { background: #006edb; }
  .results {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid #e5e5ea;
  }
  .result-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #f2f2f7;
  }
  .result-item:last-child { border-bottom: none; }
  .result-label {
    font-size: 13px;
    color: #6e6e73;
    font-weight: 500;
  }
  .result-value {
    font-family: 'Consolas', 'Menlo', monospace;
    font-size: 16px;
    font-weight: 600;
    color: #0071e3;
    text-align: right;
    word-break: break-all;
  }
  .result-value.secondary {
    color: #1d1d1f;
    font-weight: 500;
    font-size: 14px;
  }
  .hint {
    margin-top: 20px;
    padding: 12px 16px;
    background: #f0f7ff;
    border-left: 4px solid #0071e3;
    border-radius: 6px;
    font-size: 13px;
    color: #1d1d1f;
  }
  .error {
    margin-top: 20px;
    padding: 12px 16px;
    background: #fff0f0;
    border-left: 4px solid #ff3b30;
    border-radius: 6px;
    font-size: 14px;
    color: #ff3b30;
    font-weight: 500;
  }
  .example {
    display: inline-block;
    padding: 2px 8px;
    background: #f2f2f7;
    border-radius: 4px;
    font-family: 'Consolas', monospace;
    font-size: 13px;
    color: #1d1d1f;
    cursor: pointer;
  }
  .example:hover { background: #e5e5ea; }
</style>
</head>
<body>
<div class="container">
  <h1>Hex → Float Converter</h1>
  <p class="subtitle">
    Convert 4-byte hex to IEEE 754 float (32-bit).
    Also supports UINT32, INT32, UINT16, INT16.
  </p>

  <div class="row">
    <div class="field" style="flex: 2;">
      <label for="hex">Hex Input (8 characters)</label>
      <input type="text" id="hex" value="3333c741" placeholder="e.g. 3333c741" maxlength="8">
    </div>
    <div class="field small">
      <label for="endian">Endianness</label>
      <select id="endian">
        <option value="le" selected>Little-Endian</option>
        <option value="be">Big-Endian</option>
      </select>
    </div>
    <div class="field small">
      <button onclick="convert()">Convert</button>
    </div>
  </div>

  <div id="output"></div>

  <div class="hint">
    <strong>Examples:</strong><br>
    <span class="example" onclick="fillExample('3333c741')">3333c741</span> → 24.9<br>
    <span class="example" onclick="fillExample('00000000')">00000000</span> → 0.0<br>
    <span class="example" onclick="fillExample('0000803f')">0000803f</span> → 1.0<br>
    <span class="example" onclick="fillExample('000080bf')">000080bf</span> → -1.0<br>
    <span class="example" onclick="fillExample('0000c842')">0000c842</span> → 100.0
  </div>
</div>

<script>
function hexToBytes(hex) {
  const bytes = new Uint8Array(4);
  for (let i = 0; i < 4; i++) {
    bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
  }
  return bytes;
}

function convert() {
  const hexInput = document.getElementById('hex').value.trim().toLowerCase();
  const endian = document.getElementById('endian').value;
  const littleEndian = endian === 'le';
  const output = document.getElementById('output');

  // Validate input
  if (!/^[0-9a-f]{8}$/.test(hexInput)) {
    output.innerHTML = '<div class="error">Invalid hex: must be exactly 8 hex characters (4 bytes).</div>';
    return;
  }

  const bytes = hexToBytes(hexInput);
  const buffer = bytes.buffer;
  const view = new DataView(buffer);

  // Convert
  const float32 = view.getFloat32(0, littleEndian);
  const uint32  = view.getUint32(0, littleEndian);
  const int32   = view.getInt32(0, littleEndian);

  // UINT16 / INT16 (from first 2 bytes only)
  const uint16 = view.getUint16(0, littleEndian);
  const int16  = view.getInt16(0, littleEndian);

  // Hex string (reversed for Big-Endian)
  const hexReversed = littleEndian
    ? hexInput.match(/../g).reverse().join('')
    : hexInput;

  // Build output
  let html = '<div class="results">';

  html += `
    <div class="result-item">
      <span class="result-label">Float (32-bit IEEE 754)</span>
      <span class="result-value">${float32}</span>
    </div>
  `;

  html += `
    <div class="result-item">
      <span class="result-label">Float (rounded)</span>
      <span class="result-value">${float32.toFixed(4)}</span>
    </div>
  `;

  html += `
    <div class="result-item">
      <span class="result-label">UINT32 (decimal)</span>
      <span class="result-value secondary">${uint32}</span>
    </div>
  `;

  html += `
    <div class="result-item">
      <span class="result-label">INT32 (signed)</span>
      <span class="result-value secondary">${int32}</span>
    </div>
  `;

  html += `
    <div class="result-item">
      <span class="result-label">UINT16 (first 2 bytes)</span>
      <span class="result-value secondary">${uint16}</span>
    </div>
  `;

  html += `
    <div class="result-item">
      <span class="result-label">INT16 (first 2 bytes)</span>
      <span class="result-value secondary">${int16}</span>
    </div>
  `;

  html += `
    <div class="result-item">
      <span class="result-label">Hex (Big-Endian form)</span>
      <span class="result-value secondary">${hexReversed}</span>
    </div>
  `;

  html += '</div>';

  // Add a small hint about mYBUS usage
  html += `
    <div class="hint" style="margin-top: 20px;">
      <strong>mYBUS Protocol uses Little-Endian for floats.</strong><br>
      If this is a value from a registry (e.g. 0x0705), use <strong>Little-Endian</strong>.
    </div>
  `;

  output.innerHTML = html;
}

function fillExample(hex) {
  document.getElementById('hex').value = hex;
  convert();
}

// Auto-convert on page load
window.addEventListener('DOMContentLoaded', convert);
</script>
</body>
</html>
