<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- 💡 Light Bulb -->
  <symbol id="icon-light" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="20" fill="#ccc">
      <animate attributeName="fill" dur="0.3s" values="#ccc;gold;#ccc" repeatCount="indefinite" />
    </circle>
  </symbol>

  <!-- 🌀 Fan -->
  <symbol id="icon-fan" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="6" fill="#666"/>
    <path d="M32 10 L36 30 L28 30 Z" fill="#aaa">
      <animateTransform attributeName="transform" type="rotate"
        from="0 32 32" to="360 32 32" dur="1s" repeatCount="indefinite"/>
    </path>
  </symbol>

  <!-- 🌡️ Thermometer -->
  <symbol id="icon-temp" viewBox="0 0 64 64">
  <rect x="28" y="10" width="8" height="30" rx="4" fill="var(--tube-color, #ccc)"/>
  <circle cx="32" cy="45" r="10" fill="var(--bulb-color, #f44)"/>
</symbol>


  <!-- 💓 Heartbeat -->
  <symbol id="icon-heartbeat" viewBox="0 0 64 64">
    <polyline points="0,32 10,32 15,20 20,44 25,32 30,32 35,18 40,46 45,32 64,32"
      stroke="#e00" stroke-width="2" fill="none">
      <animate attributeName="stroke" values="#e00;#f66;#e00" dur="1s" repeatCount="indefinite"/>
    </polyline>
  </symbol>

  <!-- 🔊 Audio Wave -->
  <symbol id="icon-audio" viewBox="0 0 64 64">
    <polyline points="5,32 15,20 25,40 35,25 45,35 55,30"
      stroke="#0f0" stroke-width="2" fill="none">
      <animate attributeName="points" dur="1s" repeatCount="indefinite"
        values="5,32 15,20 25,40 35,25 45,35 55,30;
                5,30 15,25 25,35 35,20 45,40 55,32;
                5,32 15,20 25,40 35,25 45,35 55,30"/>
    </polyline>
  </symbol>

  <!-- ⚡ Energy Graph -->
  <symbol id="icon-energy" viewBox="0 0 64 64">
    <polyline points="0,50 10,40 20,45 30,30 40,35 50,20 60,25"
      stroke="#00f" stroke-width="2" fill="none">
      <animate attributeName="stroke" values="#00f;#0ff;#00f" dur="2s" repeatCount="indefinite"/>
    </polyline>
  </symbol>

</svg>
