<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>EcoSmart Device</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        h1 { color: #00d4ff; }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin: 10px 0;
        }
        .value { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🌐 EcoSmart Device</h1>
    
    <div class="card">
        <h2>وضعیت دستگاه</h2>
        <p>Device ID: <span class="value" id="deviceId">-</span></p>
        <p>Serial: <span class="value" id="serialNumber">-</span></p>
        <p>Firmware: <span class="value" id="firmwareVersion">-</span></p>
        <p>Uptime: <span class="value" id="uptime">-</span>s</p>
        <p>RAM Free: <span class="value" id="ramFree">-</span> bytes</p>
        <p>WiFi RSSI: <span class="value" id="wifiRSSI">-</span> dBm</p>
    </div>

    <script>
        fetch('/info')
            .then(r => r.json())
            .then(data => {
                document.getElementById('deviceId').textContent = data.deviceId;
                document.getElementById('serialNumber').textContent = data.serialNumber;
                document.getElementById('firmwareVersion').textContent = data.firmwareVersion;
                document.getElementById('uptime').textContent = data.uptime;
                document.getElementById('ramFree').textContent = data.ramFree;
                document.getElementById('wifiRSSI').textContent = data.wifiRSSI;
            })
            .catch(err => console.error(err));
    </script>
</body>
</html>
