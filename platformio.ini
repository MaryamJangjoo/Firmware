; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:EcoSmart]
platform = espressif32
board =esp32-wrover-e-n16r8
board_build.partitions = default_16MB.csv
framework = arduino
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
build_type = debug
; Additional build flags for PSRAM support
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
    -DCORE_DEBUG_LEVEL=0

; build_flags = -O2
; build_unflags = -Os
; Enable PSRAM
board_build.psram = enable
lib_deps =
    tas5805m
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    ipdotsetaf/ESPAsyncHTTPUpdateServer @ ^3.0.0
    bblanchon/ArduinoJson @ ^7.4.2
    ; https://github.com/pschatzmann/arduino-audio-tools.git
    ; https://github.com/pschatzmann/ESP32-A2DP.git
    ; esphome/ESP32-audioI2S @ ^2.3.0
    exocet22/btAudio @ ^1.1.0
    ; makuna/NeoPixelBus @ ^2.8.4
    fastled/FastLED